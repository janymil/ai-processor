version: '3.8'

services:
  ai-processor:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: Limit resources for VPS
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
